<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="global.css">
    <link href="" rel="icon">
</head>
<body class="h-full w-full p-0 m-0 overflow-hidden">
    <header class="w-full h-[50px] text-yellow-100 bg-[rgb(4,4,73)] flex items-center px-4">Images</header>
    
    <div class="flex flex-row gap-0 h-full overflow-y-hidden">
        <div class="sidebar h-full w-[225px] sticky z-10 top-0 left-0 overflow-x-hidden overflow-y-hidden text-[rgb(255,209,220)] bg-[rgb(7,7,133)] pt-5 flex flex-col justify-center items-center">
            <button class="remove text-[rgb(255,92,92)] bg-white h-[30px] w-[120px] rounded-[5px]" id="rm">Remove Image</button>
            <button class="remove text-[rgb(255,92,92)] bg-white h-[30px] w-[120px] rounded-[5px]" id="cl">Clear All</button>
            
            <div class="menu max-h-full flex-grow overflow-y-scroll">
                <table>
                    <tr class="h-[50px]"><button class="button" id="button1">
                        <img src="./images/horse.jpg" class="justify-center bg-[rgb(53,53,240)] text-black rounded-[30px] w-[200px] h-[150px]"/>
                    </button></tr>
                    <tr class="h-[50px]"><button class="button" id="button2">
                        <img src="./images/kid.png" class="bg-[rgb(53,53,240)] text-black rounded-[10px] w-[200px] h-[150px]"/>
                    </button></tr>
                </table>
            </div>
            <footer class="footer w-full h-[50px] bg-[rgb(4,4,73)]"></footer>
        </div>

        <div id="canvas" class="canvas text-blue-500 rounded-[10px] w-[90%] relative">
        </div>
    </div>

    <script src="buttons.js"></script>
</body>
</html>
