<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint PECS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="global.css">
    <link href="" rel="icon">
</head>
<body class="studio-page h-full w-full p-0 m-0 overflow-hidden select-none">
    <!-- Live Tool Cursor Outline Indicator -->
    <div id="toolCursor"></div>

    <header class="app-header" id="header">
        <span class="app-title">PECS Studio</span>
        <a href="pecs.html" class="nav-arrow" aria-label="Open sentence builder">
            <img src="graphics/backarrow.png" alt="" class="nav-arrow-image nav-arrow-forward">
        </a>
    </header>
    
    <div class="flex flex-row gap-0 h-[calc(100vh-55px)] overflow-hidden">
        <!-- Sidebar -->
        <aside class="sidebar h-full w-[270px] sticky z-10 top-0 left-0 overflow-x-hidden overflow-y-auto p-4 flex flex-col gap-4">
            
            <!-- Drawing & Eraser Controls Section -->
            <section class="control-panel flex flex-col gap-3">
                <div class="section-heading flex justify-between items-center">
                    <span>Drawing</span>
                    <span id="activeToolBadge" class="status-badge">Draw</span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button class="tool-btn quiet-button" id="drawset">
                        Draw
                    </button>
                    <button class="tool-btn quiet-button" id="rm">
                        Erase
                    </button>
                </div>
                
                <button class="quiet-button subtle" id="cl">
                    Clear canvas
                </button>

                <!-- Dynamic Brush Size Control -->
                <div class="flex flex-col gap-1 mt-1">
                    <div class="flex justify-between text-xs muted-text">
                        <span id="sizeLabel">Brush Size: 3px</span>
                        <div id="brushPreview" class="w-4 h-4 rounded-full bg-black border self-center"></div>
                    </div>
                    <input type="range" id="lineWidthSlider" min="1" max="50" value="3" class="w-full cursor-pointer" aria-label="Brush size">
                </div>

                <div class="flex flex-col gap-2 pt-3">
                    <span class="section-label">Color</span>
                    <div class="preset-row" role="group" aria-label="Drawing color">
                        <button class="preset-color" style="--swatch:#202421" data-color="#202421" aria-label="Black"></button>
                        <button class="preset-color" style="--swatch:#526f86" data-color="#526f86" aria-label="Blue"></button>
                        <button class="preset-color" style="--swatch:#58725d" data-color="#58725d" aria-label="Green"></button>
                        <button class="preset-color" style="--swatch:#9b5147" data-color="#9b5147" aria-label="Red"></button>
                        <button class="preset-color" style="--swatch:#ffffff" data-color="#ffffff" aria-label="White"></button>
                    </div>
                </div>
            </section>

            <section class="control-panel flex flex-col gap-2">
                <div class="section-heading">Library</div>
                <button id="uploadCardBtn" class="quiet-button primary">Add a custom card</button>
                <button id="manageCategoriesBtn" class="quiet-button">Manage categories</button>
                <details class="library-options">
                    <summary>Profile options</summary>
                    <div class="flex flex-col gap-2 pt-2">
                        <button id="exportProfileBtn" class="quiet-button">Export profile</button>
                        <button id="importProfileBtn" class="quiet-button">Import profile</button>
                        <button id="resetDefaultsBtn" class="quiet-button danger-text">Reset to defaults</button>
                    </div>
                </details>
                <input id="profileFileInput" type="file" accept=".zip,.pecs-profile.zip,application/zip" class="hidden">
            </section>

            <!-- Library Cards Accordion Menu -->
            <div class="menu flex flex-col gap-2 pr-1" id="libraryMenu">
                <!-- Category folds and cards are generated from the card list. -->

                <button class="button quiet-button w-full mt-1" id="buttoncustom">
                    Text Note Card
                </button>
            </div>
        </aside>

        <!-- Main Workspace Canvas Area -->
        <main id="canvas" class="z-1 w-full h-full relative overflow-hidden" aria-label="PECS card canvas">
            <canvas id="draw" class="relative h-full w-full cursor-crosshair"></canvas>
        </main>
    </div>

    <!-- Custom Card Creation Modal -->
    <div id="customCardModal" class="modal-overlay hidden">
        <div class="modal-content flex flex-col gap-4">
            <div class="flex justify-between items-center border-b border-indigo-700/60 pb-3">
                <h3 class="text-lg font-bold text-yellow-300">Create Custom PECS Card</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>

            <!-- Step 1: Upload & Crop Image -->
            <div class="flex flex-col gap-2">
                <label class="text-xs font-semibold text-indigo-200">1. Card Picture (Drag to reposition & scale)</label>
                <input type="file" id="cardImageInput" accept="image/*" class="text-xs text-indigo-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                
                <!-- Crop Preview Workspace -->
                <div id="cropArea" class="hidden flex-col items-center gap-2 mt-2 p-3 bg-indigo-950 rounded-xl border border-indigo-800">
                    <p class="text-[11px] text-indigo-300 flex items-center justify-between w-full">
                        <span>✋ Drag to move image • Scroll wheel or buttons to zoom</span>
                        <span id="cropZoomLevelText" class="text-[10px] text-yellow-400 font-mono">100%</span>
                    </p>
                    <!-- Card Frame with prominent card border outline and contrasting background -->
                    <div class="relative p-2 bg-indigo-900/80 rounded-xl border-2 border-indigo-500 shadow-lg flex flex-col items-center">
                        <div class="text-[10px] uppercase font-bold text-indigo-300 mb-1 tracking-wider">Card Crop Frame (4:3)</div>
                        <div class="relative overflow-hidden bg-slate-900 rounded-lg border-2 border-amber-400 shadow-inner">
                            <canvas id="cropCanvas" class="block cursor-grab active:cursor-grabbing select-none" width="240" height="180"></canvas>
                        </div>
                    </div>
                    <!-- Control Bar with unresticted zoom buttons -->
                    <div class="flex items-center justify-center gap-2 w-full mt-1">
                        <button id="zoomOutBtn" type="button" class="px-3 py-1 bg-indigo-800 hover:bg-indigo-700 text-white rounded text-xs font-bold shadow">- Zoom Out</button>
                        <button id="zoomInBtn" type="button" class="px-3 py-1 bg-indigo-800 hover:bg-indigo-700 text-white rounded text-xs font-bold shadow">+ Zoom In</button>
                        <button id="resetCropBtn" type="button" class="px-3 py-1 bg-gray-700 hover:bg-gray-600 text-gray-200 rounded text-xs font-medium transition">Reset</button>
                    </div>
                </div>
            </div>

            <!-- Step 2: Card Name -->
            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-indigo-200" for="cardNameInput">2. Card Label Name</label>
                <input type="text" id="cardNameInput" placeholder="e.g. My Favorite Toy" class="px-3 py-2 bg-indigo-950 border border-indigo-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-400">
            </div>

            <!-- Step 3: Category -->
            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-indigo-200" for="cardCategoryInput">3. Category</label>
                <select id="cardCategoryInput" class="px-3 py-2 bg-indigo-950 border border-indigo-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-400"></select>
            </div>

            <!-- Step 4: Audio File attachment -->
            <div class="flex flex-col gap-1">
                <label class="text-xs font-semibold text-indigo-200">4. Sound / Audio File (Optional)</label>
                <input type="file" id="cardAudioInput" accept="audio/*" class="text-xs text-indigo-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
            </div>

            <!-- Modal Action Footer -->
            <div class="flex justify-end gap-2 border-t border-indigo-700/60 pt-3 mt-1">
                <button id="cancelCardBtn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white text-xs font-semibold rounded-lg">Cancel</button>
                <button id="saveCardBtn" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg shadow">Save & Add Card</button>
            </div>
        </div>
    </div>

    <!-- Category Management Modal -->
    <div id="categoryManagerModal" class="modal-overlay hidden">
        <div class="modal-content flex flex-col gap-4" style="max-width: 900px;">
            <div class="flex justify-between items-center border-b border-indigo-700/60 pb-3">
                <div>
                    <h3 class="text-lg font-bold text-yellow-300">Manage Categories</h3>
                    <p class="text-xs text-indigo-200 mt-1">Rename categories or move cards using the selectors below.</p>
                </div>
                <button id="closeCategoryManagerBtn" class="text-gray-400 hover:text-white text-xl font-bold" aria-label="Close category manager">&times;</button>
            </div>

            <div class="flex gap-2">
                <input id="newCategoryInput" type="text" placeholder="New category name" class="flex-1 px-3 py-2 bg-indigo-950 border border-indigo-700 rounded-lg text-sm text-white focus:outline-none focus:border-indigo-400">
                <button id="addCategoryBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-lg shadow">Add Category</button>
            </div>
            <p id="categoryManagerError" class="hidden text-xs text-rose-300 bg-rose-950/60 border border-rose-700/60 rounded-lg px-3 py-2"></p>

            <div id="categoryEditorList" class="flex flex-col gap-4"></div>

            <div class="flex justify-end border-t border-indigo-700/60 pt-3">
                <button id="doneCategoryManagerBtn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-lg shadow">Done</button>
            </div>
        </div>
    </div>

    <script src="card-library.js"></script>
    <script src="buttons.js"></script>
</body>
</html>
