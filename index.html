<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint - Image Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="global.css">
    <link href="" rel="icon">
    <style>
        /* Remove animations that can be overwhelming */
        @media (prefers-reduced-motion: prefer-reduced) {
            * { animation: none !important; transition: none !important; }
        }
        
        /* Better focus indicators for keyboard navigation */
        button:focus, a:focus { outline: 3px solid #FFD700; outline-offset: 2px; }
        
        /* High contrast mode support */
        @media (prefers-contrast: more) {
            body { background: #FFFFFF; }
            button { border: 2px solid #000; }
        }
    </style>
</head>
<body class="h-full w-full p-0 m-0 overflow-hidden bg-gray-50">
    <header class="w-full h-[60px] bg-gradient-to-r from-blue-700 to-blue-800 flex items-center px-4 shadow-md border-b-4 border-blue-900">
        <h1 class="text-white font-bold text-lg">Image Builder</h1>
        <nav class="ml-auto">
            <a href="pecs.html" class="bg-white text-blue-700 font-bold px-6 py-2 rounded-lg hover:bg-blue-50 transition-colors shadow-sm focus:outline-2 focus:outline-offset-2 focus:outline-yellow-400">
                PECS Chart
            </a>
        </nav>
    </header>
    
    <div class="flex flex-row gap-0 h-full overflow-y-hidden">
        <!-- Sidebar with categories -->
        <aside class="h-full w-[260px] sticky z-10 top-0 left-0 overflow-x-hidden overflow-y-auto bg-gradient-to-b from-orange-400 to-orange-500 pt-4 px-3 shadow-lg border-r-4 border-orange-600 flex flex-col">
            <!-- Control buttons -->
            <div class="flex flex-col gap-2 mb-6">
                <button 
                    class="remove font-bold text-white bg-red-600 hover:bg-red-700 h-[45px] w-full rounded-lg transition-all active:scale-95 shadow-md focus:outline-2 focus:outline-yellow-300"
                    id="rm"
                    aria-label="Toggle remove mode - click to switch between adding and removing images"
                    title="Click to remove images from the canvas">
                    Remove Image
                </button>
                <button 
                    class="remove font-bold text-white bg-red-600 hover:bg-red-700 h-[45px] w-full rounded-lg transition-all active:scale-95 shadow-md focus:outline-2 focus:outline-yellow-300"
                    id="cl"
                    aria-label="Clear all images"
                    title="Remove all images from the canvas">
                    Clear All
                </button>
            </div>
            
            <!-- Category Menu -->
            <nav class="flex flex-col gap-2 overflow-y-auto flex-grow">
                <h2 class="text-white font-bold text-sm uppercase tracking-wider mb-2">Categories</h2>
                <button class="dropdown font-bold text-white bg-orange-600 hover:bg-orange-700 rounded-lg p-3 w-full transition-all focus:outline-2 focus:outline-yellow-300">
                    Objects
                </button>
                <div class="dropdown-content">
                    <button class="button"><img src="./images/blocks.jpg" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/bubbles.jpg" class="bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/bodybrush.jpg" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/currycomb.jpg" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/haybale.gif" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/hoofpickwithbrush.jpg" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/maneandtailbrush.png" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                </div>
                
                <button class="dropdown font-bold text-white bg-purple-600 hover:bg-purple-700 rounded-lg p-3 w-full transition-all focus:outline-2 focus:outline-yellow-300">
                    Animals
                </button>
                <div class="dropdown-content">
                    <button class="button"><img src="./images/cat.jpg" class="justify-center bg-purple-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/cow.jpg" class="justify-center bg-purple-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/dog.jpg" class="justify-center bg-purple-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/goat.gif" class="justify-center bg-purple-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/horse.jpg" class="justify-center bg-purple-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button" id="button2"><img src="./images/kid.png" class="bg-purple-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/pig.jpg" class="justify-center bg-purple-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                </div>
                
                <button class="dropdown font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg p-3 w-full transition-all focus:outline-2 focus:outline-yellow-300">
                    Emotions
                </button>
                <div class="dropdown-content">
                    <button class="button"><img src="./images/angry.jpg" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/crying.jpg" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/excited.jpg" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/happy.jpg" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/mad.jpg" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/proud.jpg" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/sad.jpg" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/surprised.gif" class="justify-center bg-blue-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                </div>
                
                <button class="dropdown font-bold text-white bg-green-600 hover:bg-green-700 rounded-lg p-3 w-full transition-all focus:outline-2 focus:outline-yellow-300">
                    Actions
                </button>
                <div class="dropdown-content">
                <button class="button"><img src="./images/calmdown.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                <button class="button"><img src="./images/crying.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                <button class="button"><img src="./images/drinking.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                <button class="button"><img src="./images/eat.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                <button class="button"><img src="./images/fistbump.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                <button class="button"><img src="./images/goodjob.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                <button class="button"><img src="./images/highfive.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                <button class="button"><img src="./images/listen.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                <button class="button"><img src="./images/putonhelmet.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                <button class="button"><img src="./images/quiet.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                <button class="button"><img src="./images/sit.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                <button class="button"><img src="./images/wait.jpg" class="justify-center bg-green-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                </div>
                
                <button class="dropdown font-bold text-white bg-yellow-600 hover:bg-yellow-700 rounded-lg p-3 w-full transition-all focus:outline-2 focus:outline-yellow-300">
                    General Communication
                </button>
                <div class="dropdown-content">
                    <button class="button"><img src="./images/goodjob.jpg" class="justify-center bg-yellow-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/hello.jpg" class="justify-center bg-yellow-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/idon'tknow.jpg" class="justify-center bg-yellow-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/ineedhelp.jpg" class="justify-center bg-yellow-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/iwant.jpg" class="justify-center bg-yellow-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/thisone.jpg" class="justify-center bg-yellow-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                    <button class="button"><img src="./images/wait.jpg" class="justify-center bg-yellow-500 text-black rounded-lg w-[200px] h-[150px]"/></button>
                </div>
                
                <button class="button font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg p-3 w-full transition-all active:scale-95 shadow-md focus:outline-2 focus:outline-yellow-300 mt-4" id="buttoncustom" aria-label="Add custom text">
                    Custom Element
                </button>
            </nav>
        </aside>
        
        <!-- Main canvas area -->
        <main id="canvas" class="flex-1 relative bg-gray-100 border-l-4 border-gray-300 overflow-hidden focus:outline-2 focus:outline-offset-2 focus:outline-yellow-400" role="region" aria-label="Canvas area - drag items here to build your message">
        </main>
    </div>

    <script src="buttons.js"></script>
</body>
</html>
