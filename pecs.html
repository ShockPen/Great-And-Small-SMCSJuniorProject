<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PECS Sentence Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="global.css">
</head>

<body class="sentence-page h-full w-full p-0 m-0 overflow-hidden flex flex-col">
    <header class="app-header gap-4">
        <span class="app-title">Sentence Builder</span>
        
        <div class="flex items-center gap-2 ml-auto">
            <label for="Categories" class="text-xs muted-text font-semibold">Category</label>
            <select id="Categories" class="plain-select">
                <!-- Categories are loaded from card-library.js -->
            </select>
        </div>

        <details class="header-options">
            <summary>Profile</summary>
            <div class="header-menu">
                <button id="exportProfileBtn" class="quiet-button">Export profile</button>
                <button id="importProfileBtn" class="quiet-button">Import profile</button>
            </div>
        </details>
        <input id="profileFileInput" type="file" accept=".zip,.pecs-profile.zip,application/zip" class="hidden">
        <a href="index.html" class="nav-arrow" aria-label="Return to PECS Studio">
            <img src="graphics/backarrow.png" alt="" class="nav-arrow-image">
        </a>
    </header>
 
    <!-- PECS Image Grid Area -->
    <main id="imageGrid" class="flex-grow flex flex-wrap gap-4 p-6 justify-center items-start content-start overflow-y-auto pb-44"></main>

    <!-- Fixed Bottom Sentence Strip Workspace -->
    <div class="sentence-workspace fixed bottom-0 left-0 w-full p-4 z-50 flex flex-col gap-2">
        <div class="flex justify-between items-center">
            <h2 class="font-bold text-sm">Sentence</h2>
            <span class="text-xs muted-text">Choose cards or add a word</span>
        </div>

        <div id="sentenceStrip" class="flex gap-3 min-h-[85px] items-center p-2 overflow-x-auto"></div>
        
        <div class="flex flex-wrap justify-between items-center gap-3 mt-1">
            <div class="flex gap-2 items-center">
                <input id="customText" type="text" placeholder="Add a word" class="plain-input w-[240px]"/>
                <button id="addTextBtn" class="quiet-button primary">
                    Add word
                </button>
            </div>
            
            <div class="flex gap-3">
                <button id="clearBtn" class="quiet-button danger-text">
                    Clear
                </button>

                <button id="playBtn" class="quiet-button primary">
                    Play sentence
                </button>
            </div>
        </div>
    </div>

    <script src="card-library.js"></script>
    <script src="pecs.js"></script>
</body>
</html>
