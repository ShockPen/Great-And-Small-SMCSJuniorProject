<!DOCTYPE html>
<html lang="en" class="h-full bg-gradient-to-b from-gray-50 to-gray-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PECS Chart - Image Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Accessibility and reduced motion */
        @media (prefers-reduced-motion: prefer-reduced) {
            * { animation: none !important; transition: none !important; }
        }
        
        /* Scrollbar stability */
        html { overflow-y: scroll; scrollbar-gutter: stable; }
        
        /* Custom scrollbar for clarity */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; border: 2px solid #f1f1f1; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Image display */
        .pecs-card img { pointer-events: none; object-fit: contain; user-select: none; }
        
        /* Better focus states */
        button:focus { outline: 3px solid #FFD700; outline-offset: 2px; }
        select:focus { outline: 3px solid #FFD700; outline-offset: 2px; }
        input:focus { outline: 3px solid #FFD700; outline-offset: 2px; }
        
        /* High contrast mode */
        @media (prefers-contrast: more) {
            body { background: #FFFFFF; }
            button { border: 2px solid #000; }
            select { border: 2px solid #000; }
        }
    </style>
</head>

<body class="h-full flex flex-col overflow-hidden select-none">

    <!-- Header with message display -->
    <section class="bg-white border-b-4 border-blue-500 shadow-lg">
        <div class="max-w-6xl mx-auto p-4">
            <div class="flex items-center justify-between gap-4 mb-4">
                <h1 class="text-xl font-black text-blue-700 uppercase tracking-widest">Message</h1>
                <div class="flex gap-3">
                    <button id="playBtn" 
                        class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-xl font-black shadow-lg active:scale-95 transition-all border-2 border-green-800 focus:outline-2 focus:outline-yellow-400"
                        aria-label="Click to speak the message aloud">
                        Speak
                    </button>
                    <button id="clearBtn" 
                        class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-xl font-black shadow-lg active:scale-95 transition-all border-2 border-red-700 focus:outline-2 focus:outline-yellow-400"
                        aria-label="Click to clear all words from the message">
                        Clear
                    </button>
                </div>
            </div>
            
            <!-- Sentence/Message strip -->
            <div id="sentenceStrip" 
                class="flex items-center gap-3 bg-blue-50 border-4 border-blue-300 rounded-xl p-4 min-h-[140px] overflow-x-auto overflow-y-hidden shadow-inner"
                role="region"
                aria-label="Message preview area - shows selected words and images"
                aria-live="polite">
            </div>
        </div>
    </section>

    <!-- Navigation and filter -->
    <nav class="bg-white border-b-4 border-gray-300 px-4 py-4 shadow-md">
        <div class="max-w-6xl mx-auto flex items-center gap-4">
            <label for="Categories" class="font-bold text-gray-700 whitespace-nowrap text-lg">Find:</label>
            <select id="Categories" 
                class="flex-1 bg-white border-4 border-blue-400 rounded-lg px-4 py-3 font-bold text-base outline-none focus:border-yellow-400 focus:shadow-lg transition-all"
                aria-label="Filter images by category">
                <option>Objects</option>
                <option>Animals</option>
                <option>Emotions</option>
                <option>Actions</option>
                <option>General Communication</option>
            </select>
            <a href="index.html" 
                class="bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-lg font-bold shadow-lg transition-all active:scale-95 border-2 border-blue-800"
                aria-label="Go back to image builder">
                Back
            </a>
        </div>
    </nav>

    <!-- Main grid area -->
    <main class="flex-1 overflow-y-auto p-4 bg-gradient-to-b from-gray-50 to-gray-100">
        <div id="imageGrid" class="max-w-6xl mx-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-4">
            <!-- Cards will be inserted here by JavaScript -->
        </div>
    </main>

    <!-- Footer with custom text input -->
    <footer class="bg-white border-t-4 border-blue-500 p-4 shadow-lg">
        <div class="max-w-6xl mx-auto flex gap-3">
            <input id="customText" 
                type="text" 
                placeholder="Type a word and press ADD..." 
                class="flex-1 bg-white border-4 border-blue-400 rounded-lg px-4 py-3 font-bold text-base outline-none focus:border-yellow-400 focus:shadow-lg transition-all"
                aria-label="Type custom text to add to your message"/>
            <button id="addTextBtn" 
                class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-lg font-black shadow-lg active:scale-95 transition-all border-2 border-blue-800 focus:outline-2 focus:outline-yellow-400"
                aria-label="Click to add the typed text to your message">
                ADD
            </button>
        </div>
    </footer>

    <script src="pecs.js"></script>
</body>
</html>
