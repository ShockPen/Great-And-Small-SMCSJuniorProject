<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-200">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mint Stable UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Prevents layout shift when scrollbars appear */
        html { overflow-y: scroll; scrollbar-gutter: stable; }
        
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Ensure images don't distort */
        .pecs-card img { pointer-events: none; object-fit: contain; }
    </style>
</head>

<body class="h-full flex flex-col overflow-hidden select-none">

    <section class="bg-white border-b-4 border-slate-300 p-4 z-10 shadow-sm">
        <div class="max-w-6xl mx-auto">
            <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-black text-slate-400 uppercase tracking-widest">Message Window</span>
                <div class="flex gap-2">
                    <button id="playBtn" class="bg-green-600 hover:bg-green-700 text-white px-8 py-2 rounded-full font-bold shadow-[0_4px_0_rgb(21,128,61)] active:translate-y-1 active:shadow-none transition-all">
                        ▶ SPEAK
                    </button>
                    <button id="clearBtn" class="bg-slate-200 hover:bg-red-100 hover:text-red-600 text-slate-600 px-4 py-2 rounded-full font-bold transition-colors">
                        Clear
                    </button>
                </div>
            </div>
            
            <div id="sentenceStrip" class="flex items-center gap-3 bg-slate-50 border-2 border-slate-200 rounded-2xl p-3 h-[120px] overflow-x-auto overflow-y-hidden shadow-inner">
                </div>
        </div>
    </section>

    <nav class="bg-slate-100 border-b border-slate-300 px-4 py-3">
        <div class="max-w-6xl mx-auto flex items-center gap-4">
            <label for="Categories" class="font-bold text-slate-700 whitespace-nowrap">Find:</label>
            <select id="Categories" class="flex-1 bg-white border-2 border-slate-300 rounded-xl px-4 py-3 font-bold text-lg outline-none focus:border-blue-500">
                <option>Objects</option>
                <option>Animals</option>
                <option>Emotions</option>
                <option>Actions</option>
                <option>General Communication</option>
            </select>
            <a href="index.html" class="bg-white border-2 border-slate-300 p-2 rounded-xl">
                <img src="graphics/backarrow.png" class="w-6 h-6 opacity-50" alt="Back"/>
            </a>
        </div>
    </nav>

    <main class="flex-1 overflow-y-auto p-4 bg-slate-200">
        <div id="imageGrid" class="max-w-6xl mx-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3">
            </div>
    </main>

    <footer class="bg-white border-t-4 border-slate-300 p-4">
        <div class="max-w-6xl mx-auto flex gap-2">
            <input id="customText" type="text" placeholder="Type a word..." 
                class="flex-1 bg-slate-100 border-2 border-slate-200 rounded-xl px-4 py-3 font-medium outline-none focus:border-blue-500 transition-all"/>
            <button id="addTextBtn" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-black shadow-[0_4px_0_rgb(29,78,216)] active:translate-y-1 active:shadow-none transition-all">
                ADD
            </button>
        </div>
    </footer>

    <script src="pecs.js"></script>
</body>
</html>
