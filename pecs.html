<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="global.css">
</head>

<body class="h-full w-full p-0 m-0 overflow-hidden">
    <header class="w-full h-[50px] text-yellow-100 bg-[rgb(4,4,73)] flex items-center px-4 gap-4">
        Images
        <select id="Categories" class="bg-[rgb(7,7,133)] ml-auto text-white px-2 py-1">
            <option>Objects</option>
            <option>Animals</option>
            <option>Emotions</option>
            <option>Actions</option>
            <option>General Communication</option>
        </select>

    
        <button class="ml-4">
            <a href="index.html"> <img src="graphics\backarrow.png" class = "w-[45px] h-[45px]"/></a>
        </button>
    </header>
 
    <div id="imageGrid" class="flex flex-wrap gap-4 p-4 justify-center"></div>

    <div class="fixed bottom-0 left-0 w-full bg-gray-200 p-4 border-t z-50">
        <h2 class="font-bold">Sentence Strip</h2>

        <div id="sentenceStrip" class="flex gap-2 mt-2 min-h-[70px]"></div>
        <div class="mt-2 flex gap-2">
            <input id="customText" type="text" placeholder="Enter custom text" class="px-2 py-1 border rounded w-[200px]"/>
            <button id="addTextBtn" class="bg-blue-600 text-white px-3 py-1 rounded">
                Add Text
            </button>
        </div>
        <div class="mt-3">
            <button id="clearBtn" class="bg-red-500 text-white px-4 py-2 rounded">
                Clear
            </button>

            <button id="playBtn" class="ml-3 bg-green-600 text-white px-4 py-2 rounded">
                Play Sentence
            </button>
        </div>
    </div>
</body>

</html>
<script src="pecs.js"></script>
